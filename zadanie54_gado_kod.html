    <textarea cols="120" rows="35">
<!DOCTYPE html>
<html lang="pl">
<head>
 <meta charset="UTF-8">
 <title>Gadomska Z54</title>
</head>
<body>

<script language="javascript">
var a_gad = (91 % 4) + 5;  // a = 3 + 5 = 8
var b_gad = (92 % 6) + 20;  // b = 2 + 20 = 22

document.write("<pre>");

for (var j = 1; j <= b_gad; j++) {
    document.write("*");
}
document.write("<br>");

for (var i = 1; i <= a_gad - 2; i++) {
    document.write("*");
    for (var k = 1; k <= b_gad - 2; k++) {
        document.write("&nbsp;");
    }
    document.write("*<br>");
}

for (var j = 1; j <= b_gad; j++) {
    document.write("*");
}
document.write("<br>");

document.write("</pre>");
document.write("a=" + a_gad + ", b=" + b_gad);
</script>

</body>
</html>
<!-- Gadomska Z54 -->
     </textarea>
</body>
</html>
