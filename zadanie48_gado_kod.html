<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Gadomska Z48</title>
</head>
<body>
<h1>Tablica mnożenia</h1>
<div style="color:green; font-size:20px;">Lena Gadomska klasa 3F1</div>
<br>
<label for="x">Podaj liczbę:</label>
<input type="number" id="x"><br><br>
<input type="button" value="POKAŻ TABLICĘ" onclick="tablica_gad()">
<input type="button" value="TEORIA" onclick="teoria_gad()">
<div id="wynik" style="margin-top:20px; font-size:22px;"></div>
<script>
function tablica_gad() {
    var x = document.getElementById("x").value;

    if (x === "") {
        document.getElementById("wynik").innerHTML = "Proszę podać liczbę.";
        return;
    }

    x = parseInt(x, 10);
    var wynik = "";

    for (var i = 1; i <= 10; i++) {
        wynik += x + " x " + i + " = " + (x * i) + "<br>";
    }

    document.getElementById("wynik").innerHTML = wynik;
}

function teoria_gad() {
    document.write("<h2>Teoria — Tablica mnożenia</h2>");
    document.write("<p>Program używa pętli for, aby utworzyć tablicę mnożenia dla podanej liczby.</p>");
    document.write("<font color=red>for (var i = 1; i <= 10; i++)</font><br>");
    document.write("<font color=green>Pętla pokazuje wszystkie mnożenia od 1 do 10.</font><br><br>");
    document.write("<font color=red>wynik += x + ' x ' + i + ' = ' + (x * i) + '<br>';</font><br>");
    document.write("<font color=green>Tworzy kolejny wiersz tablicy mnożenia.</font><br>");
}
</script>
</body>
</html>
