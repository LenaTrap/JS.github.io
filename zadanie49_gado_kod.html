<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Gadomska Z49</title>
</head>
<body>
<h1>Największa spośród trzech liczb</h1>
<div style="color:green; font-size:20px;">Lena Gadomska klasa 3F1</div>
<br>
<label for="a">Podaj pierwszą liczbę:</label>
<input type="number" id="a"><br><br>
<label for="b">Podaj drugą liczbę:</label>
<input type="number" id="b"><br><br>
<label for="c">Podaj trzecią liczbę:</label>
<input type="number" id="c"><br><br>
<input type="button" value="ZNAJDŹ NAJWIĘKSZĄ" onclick="najwieksza_gad()">
<input type="button" value="TEORIA" onclick="teoria_gad()">
<div id="wynik" style="margin-top:20px; font-size:22px;"></div>
<script>
function najwieksza_gad() {
    var a = document.getElementById("a").value;
    var b = document.getElementById("b").value;
    var c = document.getElementById("c").value;

    if (a === "" || b === "" || c === "") {
        document.getElementById("wynik").innerHTML = "Proszę podać wszystkie trzy liczby.";
        return;
    }

    a = parseFloat(a);
    b = parseFloat(b);
    c = parseFloat(c);

    var najwieksza = a;
    if (b > najwieksza) najwieksza = b;
    if (c > najwieksza) najwieksza = c;

    document.getElementById("wynik").innerHTML = "Największa liczba to: " + najwieksza;
}

function teoria_gad() {
    document.write("<h2>Teoria — Największa liczba</h2>");
    document.write("<p>Program porównuje trzy liczby, aby znaleźć największą.</p>");
    document.write("<font color=red>if (b > najwieksza) najwieksza = b;</font><br>");
    document.write("<font color=green>Jeżeli druga liczba jest większa, zamienia wartość najwiekszej.</font><br><br>");
    document.write("<font color=red>if (c > najwieksza) najwieksza = c;</font><br>");
    document.write("<font color=green>Jeżeli trzecia liczba jest większa, zamienia wartość najwiekszej.</font><br>");
}
</script>
</body>
</html>
