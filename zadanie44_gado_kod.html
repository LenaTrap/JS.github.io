<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Gadomska Z44</title>
</head>
<body>
<h1>Suma liczb od 1 do n</h1>
<div style="color:green; font-size:20px;">Lena Gadomska klasa 3F1</div>
<br>
<label for="n">Podaj liczbę n:</label>
<input type="number" id="n"><br><br>
<input type="button" value="OBLICZ" onclick="suma_do_n_gad()">
<input type="button" value="TEORIA" onclick="teoria_gad()">
<div id="wynik" style="margin-top:20px; font-size:22px;"></div>
<script>
function suma_do_n_gad() {
    var n = document.getElementById("n").value;

    if (n === "") {
        document.getElementById("wynik").innerHTML = "Proszę podać liczbę n.";
        return;
    }

    n = parseInt(n, 10);

    if (n < 1) {
        document.getElementById("wynik").innerHTML = "Podaj liczbę większą lub równą 1.";
        return;
    }

    var suma = 0;
    for (var i = 1; i <= n; i++) {
        suma += i;
    }

    document.getElementById("wynik").innerHTML = "Suma liczb od 1 do " + n + " wynosi: " + suma;
}

function teoria_gad() {
    document.write("<h2>Teoria — Suma liczb od 1 do n</h2>");
    document.write("<p>Program używa pętli for, aby dodać wszystkie liczby od 1 do n.</p>");
    document.write("<font color=red>for (var i = 1; i <= n; i++)</font><br>");
    document.write("<font color=green>Pętla powtarza się dla wszystkich liczb od 1 do n.</font><br><br>");
    document.write("<font color=red>suma += i;</font><br>");
    document.write("<font color=green>Dodaje aktualną liczbę do wyniku sumowania.</font><br>");
}
</script>
</body>
</html>
