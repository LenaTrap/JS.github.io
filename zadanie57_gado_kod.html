<!DOCTYPE html>
<head>
    <META HTTP-EQUIV="content-type" CONTENT="text/html">
    <meta charset="utf-8">
</head>
<body>
    <textarea cols="120" rows="35">
<!DOCTYPE html>
<html lang="pl">
<head>
 <meta charset="UTF-8">
 <title>Gadomska Z57</title>
</head>
<body>

<script language="javascript">
var l1_t_gad;
var l2_t_gad;

do {
    l1_t_gad = parseInt(prompt("Podaj liczbę l1_t_gad z przedziału <20,60>:", ""), 10);
    if (isNaN(l1_t_gad) || l1_t_gad <= 20 || l1_t_gad >= 60) {
        document.write("Liczba l1_t_gad nie należy do przedziału <20,60>.<br>");
    }
} while (isNaN(l1_t_gad) || l1_t_gad <= 20 || l1_t_gad >= 60);

do {
    l2_t_gad = parseInt(prompt("Podaj liczbę l2_t_gad z przedziału <20,60>:", ""), 10);
    if (isNaN(l2_t_gad) || l2_t_gad <= 20 || l2_t_gad >= 60) {
        document.write("Liczba l2_t_gad nie należy do przedziału <20,60>.<br>");
    }
} while (isNaN(l2_t_gad) || l2_t_gad <= 20 || l2_t_gad >= 60);

var pocz_gad = prompt("Podaj wartość początkową wielkości tekstu pocz_gad (3 litery nazwiska):", "GAD");
var tekst_gad = prompt("Podaj tekst tekst_gad (3 litery nazwiska):", "GAD");

if (!pocz_gad) pocz_gad = "GAD";
if (!tekst_gad) tekst_gad = "GAD";

var poczatek = parseInt(pocz_gad.replace(/\D+/g, ""), 10);
if (isNaN(poczatek)) {
    poczatek = 20;
}

document.write("<p>l1_t_gad=" + l1_t_gad + ", l2_t_gad=" + l2_t_gad + ", pocz_gad=" + poczatek + ", tekst_gad=" + tekst_gad + "</p>");

if (l1_t_gad < l2_t_gad) {
    for (var size = poczatek; size <= 100; size += 5) {
        document.write('<p style="font-size:' + size + 'px; color:black;">' + tekst_gad + '</p>');
    }
} else if (l1_t_gad > l2_t_gad) {
    for (var size = poczatek; size >= 0; size -= 5) {
        document.write('<p style="font-size:' + size + 'px; color:black;">' + tekst_gad + '</p>');
    }
} else {
    document.write('<p style="font-size:' + poczatek + 'px; color:black;">' + tekst_gad + '</p>');
}
</script>

</body>
</html>
    </textarea>
</body>
</html>
